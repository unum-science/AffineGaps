[workspace]
authors = ["Ash Vardanian <1983160+ashvardanian@users.noreply.github.com>"]
channels = ["conda-forge", "https://conda.modular.com/max", "https://repo.prefix.dev/modular-community"]
description = "Exact biosequence alignment and folding on GPUs — Needleman-Wunsch, Smith-Waterman, Levenshtein, Zuker, and Sankoff with Gotoh adjustments and traceback"
license = "Apache-2.0"
license-file = "LICENSE"
name = "affinegaps"
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
readme = "README.md"
version = "0.2.5"

# What an installed copy needs. Everything below is a feature named after its counterpart in
# `pyproject.toml`, so a group added there has one obvious place to land here.
[dependencies]
max = ">=26.5,<27"
mojo = ">=1.0.0,<2"
numpy = ">=2.0"
python = "3.12.*"

# `[project.optional-dependencies]`
[feature.color.dependencies]
colorama = "*"

[feature.numba.dependencies]
numba = ">=0.67.0,<0.68"

# The reference folders this project is measured against. Their own channel, and their own
# environment, so a contributor who only wants the tests never downloads them.
[feature.bench]
channels = ["bioconda", "conda-forge"]

[feature.bench.dependencies]
viennarna = ">=2.7"
rnastructure = "*"
consan = "*"

# Published only to PyPI, and a Rust extension rather than the pure Python its repository suggests.
[feature.bench.pypi-dependencies]
seqfold = ">=0.10"

# `[dependency-groups]`
[feature.lint.dependencies]
black = ">=26"
mypy = ">=2"
ruff = ">=0.15"

[feature.test.pypi-dependencies]
biopython = "*"
pytest = "*"
pytest-repeat = "*"
viennarna = "*"

# One environment holding every feature: a backend left out of it is a backend whose tests skip
# without failing, which is how NumBa went unexercised.
[environments]
default = ["color", "numba", "lint", "test"]
# The rivals alone cannot run a comparison: the environment also needs what imports the package.
bench = ["bench", "color", "numba", "test"]

# A matching interpreter version makes `~/.local` visible inside the environment, where a stray
# user-site install shadows the pinned one.
[activation.env]
PYTHONNOUSERSITE = "1"

[tasks]
# `mojo build -o` writes into a directory but will not create one, and `build/` is ignored, so a
# fresh clone has nowhere to put the artifact. The caller makes it rather than git tracking it.
prepare = "mkdir -p build"
# Sibling modules resolve from the same directory, so each artifact names only its own root.
# `$MOJO_ACCELERATOR` is empty locally, so the host's own GPU is detected; CI names one instead.
build = {cmd = "mojo build affinegaps.mojo --emit shared-lib -o build/affinegaps_mojo.so $MOJO_ACCELERATOR", depends-on = ["prepare"]}
build-cli = {cmd = "mojo build cli.mojo -o build/affinegaps $MOJO_ACCELERATOR", depends-on = ["prepare"]}
format = "mojo format -l 120 *.mojo"
hooks = "git config core.hooksPath .githooks"
test = {cmd = "pytest test.py", depends-on = ["build"]}
# `data/archive-ii` has to resolve, and the rivals live in their own environment.
accuracy = {cmd = "python bench.py accuracy --backend mojo --device gpu", depends-on = ["build"]}
speed = {cmd = "python bench.py speed --backend mojo --device gpu", depends-on = ["build"]}

# The checkers need this environment's interpreter to resolve NumPy and NumBa; that belongs here
# rather than as a hardcoded path in the package metadata.
lint = """
uvx ruff check *.py &&
uvx black --line-length 120 --skip-magic-trailing-comma --check *.py &&
uvx pyright --pythonpath .pixi/envs/default/bin/python
"""

# The build hook compiles the kernels into the wheel, so this needs no `build` step of its own.
install = "uv tool install --force ."
